<style>

      --accent: #5b9cff; --ok: #3fb950; --ok-bg: #12261a; --bad: #f85149; --bad-bg: #2d1416;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .row + .row { margin-top: 8px; }
  button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--muted); padding: 5px 6px; text-decoration: underline; }
  .stats { font-size: 14px; color: var(--muted); margin-left: auto; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }

  .q { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
       padding: 14px 16px; margin: 12px 0; }
  .q .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .q .clear { margin-left: auto; font-size: 12px; padding: 2px 8px; color: var(--muted); }
  .q .clear:hover { color: var(--bad); border-color: var(--bad); }

  button.danger:hover { background: var(--bad); color: #fff; }
  .q .meta .tag { padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); }
  .q .meta .tag.bad { color: var(--bad); border-color: var(--bad); }
  .q .meta .tag.ok { color: var(--ok); border-color: var(--ok); }
  .q .text { font-weight: 600; margin-bottom: 10px; }
  .opt { display: flex; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; margin: 6px 0;
         font-size: 15px; border-radius: 8px; }
  .opt b { flex: none; width: 1.3em; }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .q.done .opt { cursor: default; }
  .q.done .opt:not(.correct):not(.wrong) { opacity: .65; }
  .expl { margin-top: 10px; padding: 8px 10px; font-size: 14px; color: var(--muted);
          border-left: 3px solid var(--border); white-space: pre-line; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .note { font-size: 13px; color: var(--muted); }
</style>

],"a":1,"e":"","id":"063dc49399"},{"q":"Giá trị thặng dư là:","o":["Là phần lao động được trả công của công nhân","Là phần lao dộng không công của công nhân","Là toàn bộ lao động của công nhân","Là lao động sáng tạo của công nhân"],"a":1,"e":"","id":"7a7779ef58"},{"q":"Ngày lao động của công nhân gồm hai phần:","o":["Thời gian lao động giản đơn và thời gian lao động thặng dư","Thời gian lao động phức tạp và thời gian lao động thặng dư","Thời gian lao động cần thiết và thời gian lao động thặng dư","Thời gian lao động giản đơn và thời gian lao động phức tạp"],"a":2,"e":"","id":"a46e1ebc6c"},{"q":"Tư bản bất biến ( C )","o":["Là giá trị tư liệu sản xuất, giá trị của nó tăng lên sau quá trình sản xuất","Là giá trị tư liệu sản xuất, giá trị của nó không thay đổi sau quá trình sản xuất","Là giá trị tư liệu sản xuất, giá trị của nó giảm đi sau quá trình sản xuất","Là giá trị tư liệu sản xuất, giá trị sử dụng của nó được bảo tồn và chuyển vào sản phẩm"],"a":1,"e":"","id":"910c71701e"},{"q":"Tư bản khả biến ( V ):","o":["Là giá trị tư liệu sản xuất, giá trị của nó tăng lên sau quá trình sản xuất","Là giá trị sức lao đông, giá trị của nó tăng lên sau quá trình sản xuất","Là giá trị sức lao động, giá trị của nó giảm đi sau quá trình sản xuất","Là giá trị sức lao đông, giá trị của nó không tăng lên sau quá trình sản xuất"],"a":1,"e":"","id":"2127fc442a"},{"q":"Tư bản khả biến ( V) là:","o":["Bộ phận trực tiếp tạo ra giá trị sử dung","Bộ phận trực tiếp tạo ra giá trị thặng dư","Bộ phận trực tiếp tạo ra sản phẩm","Bộ phận gián tiếp tạo ra giá trị thặng dư"],"a":1,"e":"","id":"2cef2ecb4a"},{"q":"Căn cư phân chia tư bản bất biến và tư bản khả biến là:","o":["Căn cứ vào vai trò của các bộ phận này trong quá trình sản xuất ra giá trị","Căn cứ vào vai trò của các bộ phận này trong quá trình sản xuất ra giá trị sử dụng","Căn cứ vào vai trò của các bộ phận này trong quá trình tạo ra sản phẩm","Căn cứ vào vài trò của các bộ phận này trong quá trình sản xuất ra giá trị thặng dư"],"a":3,"e":"","id":"79ae20a64d"},{"q":"Quy luật kinh tế cơ bản của chủ nghĩa tư bản là:","o":["Quy luật giá trị","Quy luật cạnh tranh","Quy luật cung - cầu","Quy luật giá trị thặng dư"],"a":3,"e":"","id":"f46bc23ffd"},{"q":"Tỷ suất giá trị thặng dư ( m' ) là:","o":["Tỷ lệ phần trăm giữa lượng giá trị thặng dư và lượng tư bản bất biến","Tỷ lệ phần trăm giữa lượng tư bản bất biến và lượng tư bản khả biến","Tỷ lệ phần trăm giữa lượng tư bản khả biến và lượng giá trị thặng dư","Tỷ lệ phần trăm giữa lượng sản phẩm và lượng tư bản khả biến"],"a":2,"e":"","id":"3b46f662f8"},{"q":"Khối lượng giá trị thặng dư (M) được tính bằng công thức","o":["M = m'. K","M = m'. C","M= m'. V","M= m'. V'"],"a":3,"e":"Sau khi vạch rõ bản chất bóc lột của chủ nghĩa tư bản, C.Mác nghiên cứu trình độ và quy mô của sự bóc lột, tức là nghiên cứu tỷ suất và khối lượng giá trị thặng dư.\na) Tỷ suất giá trị thặng dư\nTỷ suất giá trị thặng dư là tỷ số tính theo phần trăm giữa giá trị thặng dư và tư bản khả biến tương ứng để sản xuất ra giá trị thặng dư đó.\nNếu ký hiệu m' là tỷ suất giá trị thặng dư, thì m’ được xác định bằng công thức:\nTỷ suất giá trị thặng dư chỉ rõ trong tổng số giá trị mới do sức lao động tạo ra, thì công nhân được hưởng bao nhiêu, nhà tư bản chiếm đoạt bao nhiêu. Tỷ suất giá trị thặng dư còn chỉ rõ trong một ngày lao động, phần thời gian lao động thặng dư mà người công nhân làm cho nhà tư bản chiếm bao nhiêu phần trăm so với thời gian lao động tất yếu làm cho mình. Do đó, có thể biểu thị tỷ suất giá trị thặng dư theo một công thức khác:\nTỷ suất giá trị thặng dư nói lên trình độ bóc lột của nhà tư bản đối với công nhân làm thuê, nó chưa nói rõ quy mô bóc lột. Để phản ánh quy mô bóc lột, C.Mác sử dụng phạm trù khối lượng giá trị thặng dư.\nb)      Khối lượng giá trị thặng dư\nKhối lượng giá trị thặng dư là tích số giữa tỷ suất giá trị thặng dư và tổng tư bản khả biến đã được sử dụng.\nNếu ký hiệu M là khối lượng giá trị thặng dư thì M được xác định bằng công thức:\nTrong đó:\nv: tư bản khả biến đại biểu cho giá trị 1 sức lao động\nV: Tổng tư bản khả biến đại biểu cho giá trị của tổng số sức lao động\nChủ nghĩa tư bản càng phát triển thì khối lượng giá trị thặng dư càng tăng, vì trình độ bóc lột sức lao động càng tăng.","id":"72325f897d"},{"q":"Giá trị thặng dư tuyệt đối là giá trị thăng dư có được do:","o":["Kéo dài thời gian lao động hoặc tăng năng suất lao động","Kéo dài ngày lao động hoặc tăng cường độ lao động","Kéo dài ngày lao động hoặc tăng thời gian lao động","Rút ngắn ngày lao động hoặc tăng cường độ lao động"],"a":1,"e":"","id":"3170bc6044"},{"q":"Giá trị thặng dư tương đối có được do:","o":["Tăng sản lượng, làm rút ngắn thời gian lao động cần thiết","Tăng cường độ lao động, rút ngắn thời gian lao động cần thiết","Tăng năng suất lao động, làm rút ngắn thời gian lao động cần thiết","Tăng năng suất lao động, làm rút ngắn thời gian lao động cá biệt"],"a":2,"e":"","id":"3ed5afa481"},{"q":"Giá trị thăng dư siêu ngạch là giá trị thặng dư có được do:","o":["Giá cả cá biệt của hàng hóa thấp hơn giá trị xã hội","Giá trị cá biệt của hàng hóa bằng giá trị xã hội","Giá trị xã hội của hàng hóa thấp hơn giá trị cá biệt","Giá trị cá biệt của hàng hóa thấp hơn giá trị xã hội"],"a":3,"e":"","id":"c91ab322f0"},{"q":"Giá trị thặng dư siêu ngạch còn được gọi là:","o":["Hình thức biểu hiện của giá trị thặng dư tương đối","Hình thức biến tướng của giá trị thặng dư tương đối","Hình thức biến tướng của giá trị thặng dư tuyệt đối","Hình thức biến tượng của giá trị tương đối"],"a":1,"e":"","id":"c9a6d00b51"},{"q":"Bản chất của tiền công trong chủ nghĩa tư bản là:","o":["Giá cả của hàng hóa lao động","Giá cả của hàng hóa sức lao động","Giá cả của lao động","Giá cả của hàng hóa"],"a":1,"e":"","id":"4b4fa0f02b"},{"q":"Hai hình thức của tiền công cơ bản:","o":["Tiền công theo thời gian và tiền công theo lao động","Tiền công theo giờ và tiền công theo sản phẩm","Tiền công theo thời gian và tiền công theo sản phẩm","Tiền công theo tháng và tiền công theo sản phẩm"],"a":2,"e":"","id":"08942a1daf"},{"q":"Tiền lương tính theo thời gian là:","o":["Tiền lương được trả căn cứ vào năng suất làm việc của người công nhân","Tiền lương được trả căn cứ vào thời gian làm việc của người công nhân","Tiền lương được trả căn cứ vào cường độ làm việc của người công nhân","Tiền lương được trả căn cứ vào hiện quả làm việc của người công nhân"],"a":1,"e":"","id":"47d250b247"},{"q":"Tiền lương tính theo sản phẩm là:","o":["Tiền lương được trả căn cứ vào số lượng sản phẩm người công nhân làm ra","Tiền lương được trả căn cứ vào chất lượng sản phẩm mà người công nhân làm ra","Tiền lương được trả căn cứ vào số lượng và chất lượng sản phẩm mà người công nhân làm ra","Tiền lương được trả căn cứ vào sản phẩm mà người công nhân làm ra"],"a":2,"e":"","id":"ad4ba61237"},{"q":"Tiền công danh nghĩa:","o":["Biểu hiện ở số lượng hàng tiêu dùng mà người công nhân nhận được sau mỗi thời gian làm việc","Biểu hiện ở số lượng tiền tệ mà người công nhân nhận được sau một thời gian làm việc","Biểu hiện ở chất lượng tiền tệ mà người công nhân nhận được sau một thời gian làm việc","Biểu hiện ở số lượng hàng hóa mà người công nhân nhận được sau một thời gian làm việc"],"a":1,"e":"","id":"59459daad7"},{"q":"Tiền công thực tế:","o":["Biểu hiện ở khối lượng hàng tư liệu sản xuất và dịch vụ mà người công nhân mua được bằng tiền lương danh nghĩa","Biểu hiện ở khối lượng hàng tiêu dùng và dịch vụ mà người công nhân bán được bằng tiền lương danh nghĩa","Biểu hiện ở khối lượng hàng tiêu dùng và dịch vụ mà người công nhân mua được bằng tiền lương thực tế","Biểu hiện ở khối lượng hàng tiêu dùng và dịch vụ mà người công nhân mua được bằng tiền lương danh nghĩa"],"a":3,"e":"","id":"fe8ee2383c"},{"q":"Nguồn gốc chủ yếu của tích lũy tư bản là:","o":["Lợi nhuận bình quân","Giá trị lao động","Giá trị thặng dư","Giá trị trao đổi"],"a":2,"e":"","id":"5c785c8628"},{"q":"Động cơ chủ yếu của tích lũy tư bản là:","o":["Quy luật giá trị thặng dư","Quy luật giá trị","Quy luật cung - cầu","Quy luật giá cả sản xuất"],"a":0,"e":"","id":"3edc7f9bbb"},{"q":"Những nhân tố ảnh hưởng đến quy mô tích lũy tư bản:","o":["Trình độ bóc lột sức lao động; sự chênh lệch ngày càng lớn giữa tư bản sử dụng và tư bản tiêu dùng; quy mô tư bản ứng trước","Trình độ bóc lột sức lao động; năng suất lao động; sự chênh lệch ngày càng lớn giữa tư bản sử dụng và tư bản đã tiêu dùng; quy mô tư bản ứng trước","Trình độ bóc lột sức lao động; thời gian lao động; sự chênh lệch ngày càng lớn giữa tư bản sử dụng và tư bản đã tiêu dùng; quy mô tư bản ứng trước","Trình độ bóc lột sức lao động; trình độ năng suất lao động; sự chênh lệch ngày càng lớn giữa tư bản sử dụng và tư bản tiêu dùng; quy mô lợi nhuận bình quân"],"a":1,"e":"","id":"218044c42d"},{"q":"Nguồn gốc chủ yếu của tích tụ tư bản là:","o":["Giá trị","Giá trị trao đổi","Giá trị thặng dư","Vốn của các tư bản trong xã hội"],"a":2,"e":"","id":"03879029fb"},{"q":"Tích tụ tư bản là:","o":["Quá trình tăng giảm quy mô tư bản cá biệt bằng cách tư bản hóa một phần giá trị thặng dư","Quá trình tăng quy mô của tư bản cá biệt bằng cách tư bản hóa một phần giá trị thặng dư","Quá trình tăng quy mô của tư bản xã hội bằng cách tư bản hóa một phần giá trị thặng dư","Quá trình giảm quy mô của tư bản xã hội bằng cách tư bản hóa một phần giá trị thặng dư"],"a":1,"e":"","id":"1422bf986a"},{"q":"Tập trung tư bản là:","o":["Quá trình liên kết, hợp nhất các tư bản xã hội trong xã hội thành một tư bản lớn hơn","Quá trình liên kết, hợp nhất các tư bản tiền tệ trong xã hội thành một tư bản lớn hơn","Quá trình liên kết, hợp nhất các tư bản cá biệt trong xã hội thành một tư bản lớn hơn","Quá trình liên kết, hợp nhất các tư bản thương nghiệp trong xã hội thành một tư bản lớn hơn"],"a":2,"e":"","id":"b3c8f42eeb"},{"q":"Nguồn gốc của tập trung tư bản là:","o":["Các tư bản công nghiệp trong xã hội","Các tư bản cá biệt có sẵn trong xã hội","Tư bản cá biệt của các nước","Các tư bản thương nghiệp và công nghiệp trong xã hội"],"a":2,"e":"","id":"834807b700"},{"q":"Cấu tạo hữu cơ tư bản là:","o":["Cấu tạo sản xuất của tư bản, đồng thời phản ánh sự biến đổi của cấu tạo kỹ thuật","Cấu tạo giá trị của tư bản, đồng thời phản ánh sự biến đổi của cấu tạo kỹ thuật","Cấu tạo giá trị sử dụng của tư bản, đồng thời phản ánh sự biến đổi của cấu tạo kỹ thuật","Cấu tạo giá trị thặng dư của tư bản, đồng thời phản ánh sự biến đổi của cấu tạo kỹ thuật"],"a":1,"e":"","id":"c6cf8cbb46"},{"q":"Cấu tạo kỹ thuật của tư bản:","o":["Phản ánh mối quan hệ tỷ lệ giữa khối lượng tư liệu tiêu dùng và số lao động sử dụng tư liệu tiêu dùng đó","Phản ánh mối quan hệ tỷ lệ giữa khối lượng tư liệu sản xuất và chất lượng lao động sử dụng tư liệu sản xuất đó","Phản ánh mối quan hệ tỷ lệ giữa khối lượng tư liệu tiêu dùng và chất lượng lao động sử dụng tư liệu tiêu dùng đó","Phản ánh mối quan hệ giữa tỷ lệ khối lượng và tư liệu sản xuất và số lao động sử dụng tư liệu sản xuất đó"],"a":3,"e":"","id":"0031f6a627"},{"q":"Cấu tạo giá trị phản ánh:","o":["Mối quan hệ tỷ lệ giữa giá trị tư bản cố định và giá trị tư bản khả biến","Mối quan hệ tỷ lệ giữa giá trị tư bản bất biến và giá trị tư bản khả biến","Mối quan hệ tỷ lệ giữa giá trị tư bản bất biến và giá trị tư bản cố định","Mối quan hệ tỷ lệ giữa giá trị tư bản cố định và giá trị tư bản lưu động"],"a":1,"e":"","id":"c083336dfc"},{"q":"Tuần hoàn tư bản công nghiệp là sự thống nhất của ba hình thái tuần hoàn:","o":["Tư bản lưu thông, tư bản sản xuất và tư bản hàng hóa","Tư bản tiền tệ, tư bản sủa xuất và tư bản cho vay","Tư bản tiền tệ, tư bản sản xuất và tư bản hàng hóa","Tư bản tiền tệ, tư bản trao đổi và tư bản hàng hóa"],"a":2,"e":"","id":"da99ceb65e"},{"q":"Tuần hoàn tư bản công nghiệp là:","o":["Sự vận động của tư bản trải quan ba giai đoạn, lần lượt mang lấy ba hình thái để rồi quay trở lại hình thái ban đầu với giá trị được bảo tồn","Sự vận động của tư bản trải quan ba giai đoạn, lần lượt mang lấy ba hình thái để rồi quay trở lại hình thái ban đầu với giá trị được bảo tồn và tăng lên","Sự vận động của tư bản trải quan hênh lệch I:","o":["Là địa tô thu được trên những loại ruộng đất có điều kiện tư nhiên thuận lợi","Là địa tô thu được trên những loại ruộng đất có điều kiện tư nhiên không thuận lợi","Là địa tô thu được trên những loại ruộng đất có vị trí thuận lợi","Là địa tô thu được trên những loại ruộng đất do thâm canh làm tăng năng suất"],"a":0,"e":"","id":"5fe92ba18a"},{"q":"Đia tô chênh lệch II:","o":["Là địa tô có được do chuyên canh, tăng năng suất","Là địa tô có được do thâm canh, tăng năng suất","Là địa tô có được do chuyên canh, giảm năng suất","Là địa tô có được do độc canh, tăng năng suất"],"a":1,"e":"","id":"69ace45959"},{"q":"Địa tô tuyệt đối là địa tô mà:","o":["Nhà tư bản đi thuê đất phải trả cho chủ đất, dù thuê mướn bất kỳ loại ruộng nào","Nhà tư bản đi thuê đất phải trả cho chủ đất, khi thuê mướn ruộng đất tốt","Nhà tư bản đi thuê đất không phải trả cho chủ đất, dù thuê mướn bất kỳ loại ruộng nào","Nhà tư bản đi thuê đất phải trả cho chủ đất, dù thuê mướn ruộng đất xấu"],"a":0,"e":"","id":"3b9083f766"},{"q":"Điểm giống nhau giữa địa tô chênh lệch và địa tô tuyệt đối là:","o":["Có nguồn gốc từ giá trị thặng dư","Tư bản bất biến","Có nguồn gốc từ giá trị trao đổi","Có nguồn gốc từ giá trị"],"a":3,"e":"","id":"75c42b7897"}]},{"name":"Chương III – IV","qs":[{"q":"Phương thức sản xuất tư bản chủ nghĩa được thiết lập và phát triển qua các giai đoạn nào sau đây:","o":["Chủ nghĩa tư bản độc quyền","Chủ nghĩa tư bản tự do cạnh tranh","Chủ nghĩa tư bản tự do cạnh tranh và chủ nghĩa tư bản độc quyền","Chủ nghĩa tư bản hiện đại"],"a":2,"e":"","id":"8a02b8241a"},{"q":"Trong các nhà kinh điển của chủ nghĩa Mác - Lênin, ai là người nghiên cứu chủ nghĩa tư bản độc quyền:","o":["Ph. Ăngghen","C. Mác","Ph. Ăngghen và C. Mác","V.I.Lêinin"],"a":3,"e":"","id":"b87f80173b"},{"q":"Chủ nghĩa tư bản độc quyền xuất hiện vào thời kỳ lịch sử nào:","o":["Thế kỷ XVI - XVII","Thế kỷ XVIII - XIX","Cuối thế kỷ XIX - đầu thế kỷ XX","Giữa thế kỷ XX"],"a":2,"e":"","id":"98c834cd43"},{"q":"Chủ nghĩa tư bản độc quyền là:","o":["Một phương thức sản xuất","Giai đoạn phát triển của phương thức sản xuất tư bản chủ nghĩa","Một hình thái kinh tế xã hội","Thời kỳ quá độ đi lên chủ nghĩa xã hội"],"a":1,"e":"","id":"483caec18e"},{"q":"Những nguyên nhân nào sau đây dẫn đến sự ra đời của chủ nghĩa tư bản độc quyền:","o":["Do đấu tranh của giai cấp","Do sự phát triển của lực lượng sản xuất xã hội hóa","Sự can thiệp điều chỉnh của nhà nước tư sản","Sự tập trung sản xuất dưới tác độc của cách mạng khoa học công nghệ, cạnh tranh, khủng hoảng kinh tế và tín dụng"],"a":3,"e":"","id":"70f06bdd63"},{"q":"Trong các nhà kinh điển của chủ nghĩa Mác - Lênin, ai là người khái quát về nguyên nhân ra đời của chủ nghĩa tư bản độc quyền bằng câu: \"tự do cạnh tranh đẻ ra tập trung sản xuất và sự tập trung sản xuất này, khi phát triển tới một mức độ nhất định lại dẫn tới độc quyền\".","o":["Ph. Ăngghen","C. Mác","Ph. Ăngghen và C. Mác","V.I.Lêinin"],"a":3,"e":"","id":"e983776c8a"},{"q":"V.I. Lênin đã phân tích chủ nghĩa tư bản độc quyền bằng các đặc điểm kinh tế cơ bản nào sau đây:","o":["Tập trung sản xuất và các tổ chức độc quyền; tư bản tài chính và bọn đầu sỏ tài chính","Tập trung sản xuất và các tổ chức độc quyền; tư bản tài chính và bọn đầu sỏ tài chính; xuất khẩu tư bản","Tập trung sản xuất và các tổ chức độc quyền, tư bản tài chính và bọn đầu sỏ tài chính; xuất khẩu tư bản; phân chia thế giới về kinh tế giữa các tổ chức độc quyền","Tập trung sản xuất và các tổ chức độc quyền, tư bản tài chính và bọn đầu sỏ tài chính; xuất khẩu tư bản; phân chia thế giới về kinh tế giữa các tổ chức độc quyền; sự phân chia thế giới về lãnh thổ giữa các cường quốc đế quốc"],"a":3,"e":"","id":"96116d0a5a"},{"q":"Sự hình thành các tổ chức độc quyền dựa trên cơ sở:","o":["Sản xuất nhỏ lẻ, phân tán","Tích tụ tập trung sản xuất và sự xuất hiện các xí nghiệp quy mô lớn","Phát triển khoa học - kỹ thuật","Sự hoàn thiện quan hệ sản xuất tư bản chủ nghĩa"],"a":1,"e":"","id":"547a165141"},{"q":"Các hình thức độc quyền phát triển từ thấp đến cao, từ lưu thông đến sản xuất và tái sản xuất. Hãy xác định trình tự phát triển của các hình thức độc quyền","o":["Cácten - Tơ rớt - Công xoóc xiom - Xanh đi ca","Tơ rớt - Cácten - Xanh đi ca - Công xoóc xiom","Cácten - Xanh đi ca - Tơ rớt - Công xoóc xiom- Công gơ lô mê rát","Xanh đi ca - Cácten - Tơ rớt - Công xoóc xiom -- Công gơ lô mê rát"],"a":2,"e":"","id":"65340e454a"},{"q":"Sự ra đời và phát triển của độc quyền ngân hàng thông qua quá trình nào sau đây:","o":["Cạnh tranh - ngân hàng nhỏ phá sản","Ngân hàng nhỏ xát nhập với nhau","Còn lại các ngân hàng lớn có xu hướng liên minh"],"a":2,"e":"","id":"adcd0c78fc"},{"q":"Sự ra đời và phát triển của tư bản tài chính là kết quả phát triển của:","o":["Độc quyền ngân hàng","Độc quyền công nghiệp","Quá trình độc quyền hóa trong công nghiệp và trong ngân hàng xoăn xuýt với nhau","Sự phát triển của thị trường tài chính"],"a":2,"e":"","id":"90f55bedec"},{"q":"Vai trò mới của ngân hàng trong giai đoạn chủ nghĩa tư bản đọc quyền là:","o":["Khống chế hoạt động của nền kinh tế tư bản chủ nghĩa","Trung gia thanh toán","Trung gian tín dụng","Đầu tư tư bản"],"a":0,"e":"","id":"edd6baceda"},{"q":"Chế độ tham dự của tư bản tài chính được thiết lập thông qua:","o":["Quyết định hành chính của nhà nước","Yêu cầu hành chính của ngân hàng","Yêu cầu hành chính của các tổ chức độc quyền công nghiệp","Số cố phiếu khống chế để nắm công ty mẹ, công ty con"],"a":3,"e":"","id":"c0491805d3"},{"q":"Xuất khẩu hàng hóa là một trong những đặc điểm của:","o":["Sản xuất hàng hóa giản đơn","Phương thức sản xuất tư bản chủ nghĩa","Giai đoạn chủ nghĩa tư bản tự do cạnh tranh","Giai đoạn chủ nghĩa tư bản độc quyền"],"a":2,"e":"","id":"b070ecfe66"},{"q":"Xuất khẩu tư bản là đặc điểm của:","o":["Phương thức sản xuất phong kiến","Phương thức sản xuất tư bản chủ nghĩa","Chủ nghĩa tư bản giai đoạn tự do cạnh tranh","Chủ nghĩa tư bản giai đoạn độc quyền"],"a":3,"e":"","id":"a463fce418"},{"q":"Xuất khẩu hàng hóa là:","o":["Xuấ  giá cả < tổng giá trị","Tổng giá cả ≥ tổng giá trị"],"a":1,"e":"CHỨNG MINH GIÁ CẢ HÀNG HÓA TRONG QUÁ TRÌNH MUA BÁN ĐƯỢC XÁC ĐỊNH BẰNG GIÁ TRỊ HÀNG HÓA (vì sao trao đổi phải dựa trên nguyên tắc ngang giá)Trong nền kinh tế, việc sản xuất và trao đổi hàng hóa phải dựa trên cơ sở hao phí lao động xã hội cần thiết, có nghĩa là trao đổi phải theo quy tắc ngang giá- Chứng minh vế trao đổi: Khi tham gia trao đổi phải dựa trên cơ sở hp ldxhct mà k dựa trên hao phí lao động cá biệt vì hao phí lđ xh cần thiết được tính dựa trên hao phí trung bình của mọi người, còn hao phí lao động cá biệt thì sẽ được tính theo các chủ thể khác nhau.Trao đổi phải thực hiện trên quy luật ngang giá vì: con người hoạt động hoạt động vì động cơ lợi ích cá nhân, trong trao đổi mua bán ai cx muốn có lợi cho bản thân => chỉ diễn ra quan hệ mua bán khi cả người bán và người mua hài lòng. Khi ta xét trường hợp trao đổi không ngang giá, cung > cầu => lợi thế thuộc về người mua => giá cả < giá trị, ngược lại cung < cầu => lợi thế thuộc về người bán => giá cả > giátrị. Mặt khác trong nền kinh tế hàng hóa, cung luôn có xu hướng cân bằng với cầu => giá cả có xu hướng ngang bằng với giá trị => TRAO ĐỔI DIỄN RA KHI GIÁ CẢ BẰNG GIÁ TRỊ.- Chứng minh vế sản xuất: Sản xuất cần dựa trên cơ sở hao phí lđ xh cần thiết: vì khi trao đổi hàng hóa, bán sản phẩm trên thị trường thì bán trên cơ sở GIÁ CẢ NGANG BẰNG với GIÁ TRỊ, với hao phí lao động trung bình trong ngành để sản xuất hàng hóa đó. Người sản xuất cần xác định hao phí lao động của mình so với hao phí lđxh trung bình trong ngành. Hao phí lđ xh cá biệt của mình cao hơn ldxh trung bình trong ngành => K đầu tư, bỏ hoặc tìm cách giảm cái của mình đi sao cho phù hợp. Có như vậy họ mới có lợi. Hao phí lđ cá biệt = Hao phí lđxh là đã có lợi nhuận, ok đầu tư","id":"f6bc55d7e6"},{"q":"Trong giai đoạn chủ nghĩa tư bản tự do cạnh tranh, quy luật giá trị biểu hiện thành:","o":["Quy luật giá cả sản xuất","Quy luật giá cả độc quyền","Quy luật tỷ suất lợi nhuận bình quân"," ết để sản xuất ra\nhàng hoá càng tăng và lượng giá trị của một đơn vị sản phẩm càng nhiều. Lượng giá trị\nhàng hoá tỷ lệ thuận với số lượng lao động kết tinh và tỷ lệ nghịch với năng suất lao động xã\nhội.\nb)Cường độ lao động\n-Là mức độ hao phí sức lao động trong một đơn vị thời gian.\n–>Ảnh hưởng: Cường độ lao động tăng lên thì số lượng hàng hóa sản xuất ra tăng lên\nnhưng sức lao động hao phí cũng tăng lên, vậy lượng giá trị hàng hóa vẫn không đổi.\nNhưng khi tăng năng suất lao động và tăng cường độ lao động giống nhau thì làm cho\nlượng sản phẩm sản xuất ra trong một đơn vị thời gian tăng lên, mà đổi lại làm cho giá trị\ncủa một đơn vị hàng hóa giảm xuống","id":"01f8f1bd56"},{"q":"Việc mua bán nô lệ và mua bán sức lao động quan hệ với nhau thế nào? Chọn ý đúng:","o":["Hoàn toàn khác nhau","Có quan hệ với nhau","Giống nhau về bản chất, chỉ khác về hình thức"],"a":0,"e":"","id":"6c26f76bfd"},{"q":"Khi nào sức lao động trở thành hàng hoá một cách phổ biến?","o":["Trong nền sản xuất hàng hoá TBCN","Trong xã hội chiếm hữu nô lệ","Trong nền sản xuất lớn hiện đại"],"a":0,"e":"","id":"48f3cf4636"},{"q":"Nguyên nhân của bản chất khủng hoảng kinh tế TBCN là","o":["Bắt nguồn từ mâu thuẫn của bản chất của CNTB","Do sản xuất không có kế hoạch","Do chạy theo lợi nhuận"],"a":0,"e":"","id":"8f66dc9816"},{"q":"Mục đích trực tiếp của nền sản xuất TBCN là:","o":["Tạo ra ngày càng nhiều giá trị thặng dư","Làm cho lao động ngày càng lệ thuộc vào tư bản","Sản xuất ra ngày càng nhiều của cải vật chất"],"a":0,"e":"","id":"2ea207817c"},{"q":"Khi tăng cường độ lao động sẽ xảy ra các trường hợp dưới đây. Trường hợp nào dưới đây là đúng?","o":["Số lượng hàng hoá làm ra trong một đơn vị thời gian tăng","Năng suất lao động thay đổi","Giá trị 1 đơn vị hàng hoá tăng lên"],"a":0,"e":"","id":"b40e4dbe2f"},{"q":"Quy luật chung của tích luỹ tư bản là gì? ý nào sau đây không đúng:","o":["Giai cấp tư sản ngày càng giàu có, mâu thuẫn trong CNTB tăng lên","Cấu tạo hữu cơ của tư bản tăng lên","Quá trình bần cùng hoá giai cấp vô sản"],"a":0,"e":"","id":"de8d63ac60"},{"q":"Quy luật giá trị hoạt động tự phát có thể dẫn đến sự hình thành QHSX TBCN không? Chọn câu trả lời đúng nhất:","o":["Có nhưng rất chậm chạp","Có","Không"],"a":2,"e":"","id":"62f4549f4d"},{"q":"Trong phương pháp sản xuất giá trị thặng dư tuyệt đối, người lao động muốn giảm thời gian lao động trong ngày còn nhà tư bản lại muốn kéo dài thời gian lao động trong ngày. Giới hạn tối thiểu của ngày lao động là bao nhiêu?","o":["Lớn hơn thời gian lao động cần thiết","Đủ bù đắp giá trị sức lao động của công nhân","Bằng thời gian lao động cần thiết"],"a":0,"e":"","id":"1beaf38994"},{"q":"Các công thức tính tỷ suất giá trị thặng dư dưới đây, công thức nào đúng?","o":["m' = m/v *100%","m' = thời gian lao động thặng dư/thời gian lao động cần thiết *100%","m'= thời gian lao động thặng dư/lao động cần thiết"],"a":0,"e":"","id":"19b11edd3a"},{"q":"Sự phân chia tư bản thành tư bản bất biến và tư bản khả biến là để biết:","o":["Đặc điểm chuyển giá trị của từng loại tư bản vào sản phẩm","Vai trò của lao động quá khứ và lao động sống trong việc tạo ra giá trị sử dụng","Nguồn gốc của giá trị thặng dư"],"a":2,"e":"","id":"ec01ec971f"},{"q":"Tỷ suất giá trị thặng dư (m') phản ánh điều gì? Chọn ý đúng:","o":["Trình độ bóc lột của tư bản đối với công nhân làm thuê","Hiệu quả của tư bản","Chỉ cho nhà tư bản biết nơi đầu tư có lợi"],"a":0,"e":"","id":"d36080538c"},{"q":"Cạnh tranh giữa các ngành xảy ra khi có sự khác nhau về","o":["Tỷ suất lợi nhuận","Giá trị thặng dư siêu ngạch","Cung cầu các loại hàng hoá"],"a":0,"e":"","id":"6660a10e50"}]},{"name":"Chương V","qs":[{"q":"Phát triển KTTTr định hướng XHCN là tất yếu vì:","o":["Phù hợp với tính quy luật phát triển khách quan","Tính ưu việt của KTTTr trong thúc đẩy phát triển; phù hợp với nguyện vọng của nhân dân mong muốn dân giàu, nước mạnh, dân chủ, công bằng, văn minh","là hình thức tổ chức kinh tế- xã hội hiệu quả nhất","a và b"],"a":3,"e":"","id":"66b27974ee"},{"q":"Những điều kiện KT- XH khách quan quy định sự tồn tại tất yếu, lâu dài của KTTTr định hướng XHCN ở nước ta là :","o":["Phân công lao động xã hội","Tính chất XH hóa của lực lượng SX","Các hình thức khác nhau của quan hệ sở hữu TLSX","a và c"],"a":3,"e":"","id":"84812d3be3"},{"q":"KTTTr định hướng XHCN ở VN có mấy đặc trưng, kể tên những đặc trưng đó:","o":["3 đặc trưng","2 đặc trưng","4 đặc trưng","5 đặc trưng"],"a":3,"e":"","id":"a64b1abf73"},{"q":"Phạm trù sở hữu bao gồm các vấn đề","o":["Chủ thể sở hữu","Đối tượng sở hữu","Lợi ích từ đối tượng sở hữu","Cả a; b; c"],"a":3,"e":"","id":"399efd0d48"},{"q":"ND kinh tế của phạm trù sở hữu biểu hiện ở:","o":["Lợi ích KT","Lợi ích KT mà chủ sở hữu sẽ được thụ hưởng","Địa vị của các chủ thể kinh tế trong quan hệ sở hữu","Quyền hạn và nghĩa vụ của chủ thể sở hữu"],"a":1,"e":"","id":"8b94503d69"},{"q":"Thành phần kinh tế nhà nước trong nền KTTTr định hướng XHCN đóng vai trò:","o":["chủ đạo trong nền kinh tế","động lực của nền kinh tế","định hướng XHCN cho nền KT","nền tảng của nền KT quốc dân"],"a":0,"e":"","id":"aade0e9a1e"},{"q":"Thành phần kinh tế tư nhân trong nền KTTTr định hướng XHCN đóng vai trò:","o":["chủ đạo trong nền kinh tế","động lực của nền kinh tế","định hướng XHCN cho nền KT","nền tảng của nền KT quốc dân"],"a":1,"e":"","id":"863922ce25"},{"q":"Mục tiêu của KTTTr định hướng XHCN là :","o":["Phát triển LLSX hiện đại gắn với XD QHSX tiến bộ","Hoàn thiện cơ sở KT-XH cuả CNXH","Kích thích cải tiến kĩ thuật, phát triển LLSX, thực hiện dân giàu nước mạnh","a và b"],"a":3,"e":"","id":"42873ca04b"},{"q":"Vai trò của mọi nhà nước trong nền kinh tế thị trường hiện đại là:","o":["Điều tiết vĩ mô nền kinh tế","Tạo môi trường kinh tế ổn định và hành lang pháp lí cho các chủ thể hoạt động","Khắc phục thất bại thị trường","Phát huy ưu việt của KTTTr"],"a":0,"e":"","id":"add65371e8"},{"q":"Trong nền KTTTr định hướng XHCN, Nhà nước Việt Nam điều tiết quá trình phát triển kinh tế của đất nước nhằm:","o":["Khắc phục hạn chế, khuyết tật của KTTTr","Phát huy ưu việt của KTTTr","Định hướng, thực hiện những mục tiêu KT- XH trong từng thời kỳ","Tất cả các đáp án trên"],"a":3,"e":"","id":"6b2aeb090c"},{"q":"Quan hệ quản lí và cơ chế quản lí trong nền KTTTr định hướng XHCN có đặc trưng:","o":["Nhà nước Việt Nam điều tiết quá trình phát triển kinh tế của đất nước","Nước quản lí và thực hành cơ chế quản lí là NNước pháp quyền XHCN, của dân do dân vì dân","Nhà nước quản lí dưới sự lãnh đạo của Đảng cộng sản; sự làm chủ và giám sát của nhân dân","cả b và c"],"a":3,"e":"","id":"5f47237511"},{"q":"Phân phối đầu ra trong nền KTTTr :","o":["Bao gồm nhiều hình thức phân phối","Bao gồm phân phối theo lao động, phân phối theo mức góp vốn(tài sản), phân phối thông qua phúc lợi","Phân phối theo LĐ là chủ yếu","Phân phối theo nguyên tắc thị trường là chủ yếu"],"a":1,"e":"","id":"cde7bc3874"},{"q":"Để đảm bảo tăng trưởng KT đi đôi với công bằng XH trong nền KTTTr ở VN thì phải:","o":["Gắn tăng trưởng KTvới công bằng XH","Phát triển KT đi đôi với phát triển VH- XH","Thực hiện công bằng, tiến bộ trong từng chính sách, kế hoạch và trong cả quá trình phát triển","cả a; b; c"],"a":3,"e":"","id":"4124ad3eda"},{"q":"Lí do phải hoàn thiện thể chế KTTTr định hướng XHCN:","o":["Do thể chế KTTTr định hướng XHCN còn chưa đồng bộ; chưa đầy đủ","Do quản lí KT của NN còn yếu kém","Do hệ thống thể chế còn kém hiệu lực , hiệu quả, kém đầy đủ các yếu tố thị trường, các loại thị trường","a và c"],"a":3,"e":"","id":"a47ca245cb"},{"q":"Những nhiệm vụ chủ yếu để hoàn thiện thể chế KTTTr định hướng XHCN","o":["Hoàn thiện thể chế về sở hữu và phát triển các thành phần kinh tế; để phát triển đồng bộ các yếu tố thị trường và các loại thị trường","Hoàn thiện thể chế để đảm bảo gắn tăng trưởng KT với tiến bộ, công bằng XH;","Hoàn thiện thể để thúc đẩy hội nhập KTQT và nâng cao năng lực hệ thống chính trị","Tất cả các đáp án trên"],"a":3,"e":"","id":"b34b1b14fa"},{"q":"Nội dung của hoàn thiện thể chế về sở hữu:","o":["Thể chế hóa đầy đủ quyền tài sản","Hoàn thiện pháp luật về đất đai; về quản lí khai thác sử dụng tài nguyên; về đầu tư vốn nhà nước sử dụng tài sản công","Hoàn thiện hệ thống thể chế liên quan đến quyền sở hữu trí tuệ; về hợp đồng vfa giải quyết tranh chấp dân sự; về thể chế cho sự phát triển các thành phần kinh tế","Cả a; b; c"],"a":3,"e":"","id":"2305269e94"},{"q":"Quan hệ lợi ích kinh tế:","o":["là sự thiết lập những tương tác giữa người với người , giữa các cộng đồng; giữa các tổ chức KT; giữa các bộ phận hợp thành nền KT;","là quan hệ giữa mỗi người với tổ chức KT; giữa quốc gia với phần còn lại của thế giới","Nhằm mục tiêu xác lập các lợi ích Kt trong mối liên hệ với trình độ phát triển của LLSX và Kiến trúc thượng tầng tương ứng với 1 Gđoạn phát triển nhất định của XH","Cả a, b, và c"],"a":3,"e":"","id":"b53b8111e2"},{"q":"Đặc trưng của quan hệ lợi ích KT:","o":["Vừa có sự thống nhất, vừa có mâu thuẫn","Có sự thống nhất tuyệt đối, lợi ích của các chủ thể gắn với nhau","Có sự mâu thuẫn gay gắt, khác biệt giữa các chủ thể KT","Đáp án a và b"],"a":0,"e":"","id":"661a5866f3"},{"q":"Những nhân tố ảnh hưởng đến quan hệ lợi ích KT là","o":["Trình độ của LLSX, địa vị của chủ thể trong hệ thống QHSX; Chính sách phân phối thu nhập của Nhà nước và ảnh hưởng từ hội nhập KTQT","Năng lực quản lí của Nhà nước trong KTTTr","Hệ thống QHSX hiện thời","Tất cả các đáp án trên"],"a":3,"e":"","id":"8035639520"},{"q":"Các quan hệ lợi ích cơ bản trong nền KTTTr là quan hệ lợi ích:","o":["...giữa người LĐ và người sử dụng LĐ",".. giữa những người sử dụng LĐ","..giữa những người Lđ; giữa lợi ích cá nhân, lợi ích nhóm và lợi ích XH","Cả a, b, c"],"a":3,"e":"","id":"d489c2272d"},{"q":"Phương thức thực hiện lợi ích KT trong các quan hệ lợi ích trong nền KTTTr:","o":["Theo nguyên tắc thị trường","Theo chính sách an sinh XH","Kết hợp theo nguyên tắc thị trường; theo chính sách của Nhà nước và vai trò của các tổ chức XH","Theo nguyện vọng của người LĐ"],"a":2,"e":"","id":"ca2a1a43bb"},{"q":"Vai trò của Nhà nước trong đảm bảo hài hòa lợi ích KT là:","o":["Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi cho hoạt động tìm kiếm lợi ích của các chủ thể KT; Điều hòa lợi ích cá nhân- doanh nghiệp- xã hội","Thực hiện phân phối công bằng,tạo động lực thúc đẩy các hoạt động KT, gia tăng thu nhập cho các chủ thể KT","Kiểm soát, ngăn ngừa các quan hệ lợi ích có ảnh hưởng tiêu cực đối với sự phát triển XH; giải quyết mâu thẫn trong quan hệ lợi ích KT","a và c"],"a":3,"e":"","id":"80df98d72f"},{"q":"Kinh tế thị trường là gì?","o":["Tiếp tục rà soát, bổ sung, điều chỉnh hệ thống pháp luật và các thể chế liên quan đáp ứng yêu cầu thực hiện các cam kết quốc tế của Việt Nam, thực hiện nhất quán chủ trương đa phương hóa, đa dạng hóa trong hợp tác kinh tế quốc tế, không để bị lệ thuộc vào một số ít thị trường","Kinh tế thị trường định hướng xã hội chủ nghĩa","Thành tựu của nền văn minh nhân loại và không đối lập với chủ nghĩa xã hội","Một nấc thang phát triển của lực lượng sản xuất"],"a":2,"e":"","g":1,"id":"1d70cd9d29"},{"q":"Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa là đường lối chiến lược nhất quán, là mô hình kinh tế tổng quát trong suốt thời kì quá độ lên chủ nghĩa xã hội ở Việt Nam, sự tất yếu khách quan xuất phát từ mấy lí do cơ bản?","o":["Ba","Nhà nước","Tư nhân","Tập thể"],"a":0,"e":"","g":1,"id":"d6a8045e44"},{"q":"Căn cứ trực tiếp để xác định các thành phần kinh tế là căn cứ nào?","o":["Sở hữu về tư liệu sản xuất","Kinh tế tư nhân","Lợi ích kinh tế là động lực trực tiếp của các thể chế kinh tế và hoạt động kinh tế xã hội, lợi ích kinh tế là cơ sở thúc đẩy sự phát triển các lợi ích khác","Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế"],"a":0,"e":"","g":1,"id":"e190e77ad9"},{"q":"Thành phần kinh tế nào nắm giữ những ngành, lĩnh vực then chốt của nền kinh tế?","o":["Kinh tế nhà nước","Sở hữu về tư liệu sản xuất","Kinh tế hàng hóa","Nền kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lí của nhà nước, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam"],"a":0,"e":"","g":1,"id":"7d9a85bd5d"},{"q":"Nghị quyết Hội nghị lần thứ Năm, khóa XXII, ngày 3/6/2017 của Ban Chấp hành Trung ương Đảng xác định thành phần kinh tế nào là động lực quan trọng để phát triển kinh tế nước ta hiện nay?","o":["Kinh tế tư nhân","Sở hữu về tư liệu sản xuất","Nền kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lí của nhà nước, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam","Kinh tế thị trường định hướng xã hội chủ nghĩa"],"a":0,"e":"","g":1,"id":"d319d9836a"},{"q":"Thành phần kinh tế nào chưa được công nhận trong nền kinh tế nước ta hiện nay?","o":["Kinh tế hàng hóa","Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế","Tiếp tục rà soát, bổ sung, điều chỉnh hệ thống pháp luật và các thể chế liên quan đáp ứng yêu cầu thực hiện các cam kết quốc tế của Việt Nam, thực hiện nhất quán chủ trương đa phương hóa, đa dạng hóa trong hợp tác kinh tế quốc tế, không để bị lệ thuộc vào một số ít thị trường","Trình độ phát triển của lực lượng sản xuất, địa vị của chủ thể trong hệ thống quan hệ sản xuất xã hội, chính sách phân phối thu nhập của nhà nước, hội nhập kinh tế quốc tế"],"a":0,"e":"","g":1,"id":"296ac90981"},{"q":"Nghị quyết Hội nghị lần thứ Năm, khóa XXII, ngày 3/6/2017 của Ban Chấp hành Trung ương Đảng xác định thành phần kinh tế nào nắm giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng xã hội chủ nghĩa?","o":["Bình đẳng, hợp tác, cạnh tranh cùng phát triển theo pháp luật","Kinh tế nhà nước","Lợi ích vật chất, lợi ích thu được khi thực hiện các hoạt động kinh tế của con người","Mô hình kinh tế tổng quát trong thời kì quá độ lên chủ nghĩa xã hội ở nước ta"],"a":1,"e":"","g":1,"id":"ed4bb4bb38"},{"q":"Doanh nghiệp thuộc khu vực nào đóng vai trò then chốt trong nền kinh tế nước ta?","o":["Ba","Nhà nước","Tập thể","Tư nhân"],"a":1,"e":"","g":1,"id":"77a60e9c80"},{"q":"Nghị quyết số 11-NQ/TW ngày 3/6/2017 về hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa, đã nêu ra mấy hạn chế trong thể chế kinh tế thị trường định hướng xã hội chủ nghĩa?","o":["Tiền công","Tư nhân","Con người","Sáu"],"a":3,"e":"","g":1,"id":"6a950c2e0a"},{"q":"Để hoàn thiện thể chế về sở hữu trong nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam cần phải thực hiện mấy nội dung?","o":["Bảy","Bốn","Con người","Sáu"],"a":0,"e":"","g":1,"id":"d926288409"},{"q":"Lợi ích kinh tế trước hết của người lao động là gì?","o":["Nhà nước","Sáu","Tập thể","Tiền công"],"a":3,"e":"","g":1,"id":"f9d1546544"},{"q":"Tập đoàn Dầu khí Quốc gia Việt Nam hiện tại thuộc thành phần kinh tế gì?","o":["Nhà nước","Con người","Ba","Tập thể"],"a":0,"e":"","g":1,"id":"fbcefaeec8"},{"q":"Hợp tác xã vận tải nước ta hiện nay thuộc thành phần kinh tế nào?","o":["Sáu","Con người","Tập thể","Bốn"],"a":2,"e":"","g":1,"id":"a8df620e1a"},{"q":"Kinh tế cá thể, hộ gia đình ở nước ta hiện nay thuộc thành phần kinh tế nào?","o":["Ba","Tư nhân","Tập thể","Con người"],"a":1,"e":"","g":1,"id":"16929d1c5d"},{"q":"Trong điều kiện kinh tế thị trường, ở đâu có hoạt động kinh tế, ở đó có quan hệ lợi ích. Trong đó có mấy quan hệ lợi ích kinh tế cơ bản?","o":["Bảy","Tiền công","Bốn","Con người"],"a":2,"e":"","g":1,"id":"165440303c"},{"q":"Tính tất yếu khách quan của việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam, xuất phát mấy lí do cơ bản?","o":["Bốn","Tư nhân","Ba","Con người"],"a":2,"e":"","g":1,"id":"1cea715d10"},{"q":"Xây dựng và hoàn thiện thể chế về hội nhập kinh tế quốc tế ở Việt Nam hiện nay cần tập trung vào các nhiệm vụ nào?","o":["Dân giàu, nước mạnh, dân chủ, công bằng, văn minh","Bình đẳng, hợp tác, cạnh tranh cùng phát triển theo pháp luật","Nền kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lí của nhà nước, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam","Tiếp tục rà soát, bổ sung, điều chỉnh hệ thống pháp luật và các thể chế liên quan đáp ứng yêu cầu thực hiện các cam kết quốc tế của Việt Nam, thực hiện nhất quán chủ trương đa phương hóa, đa dạng hóa trong hợp tác kinh tế quốc tế, không để bị lệ thuộc vào một số ít thị trường"],"a":3,"e":"","g":1,"id":"4e0736f635"},{"q":"Trong các nhân tố tăng trưởng kinh tế, Đảng ta xác định nhân tố nào là quyết định nhất của tăng trưởng nhanh và bền vững?","o":["Ba","Con người","Tập thể","Bảy"],"a":1,"e":"","g":1,"id":"c0e67326d8"},{"q":"Lợi ích kinh tế là gì?","o":["Sở hữu về tư liệu sản xuất","Lợi ích vật chất, lợi ích thu được khi thực hiện các hoạt động kinh tế của con người","Cương lĩnh, đường lối phát triển kinh tế - xã hội và các chủ trương, quyết sách lớn trong từng thời phát triển của đất nước","Có vốn đầu tư nước ngoài"],"a":1,"e":"","g":1,"id":"5df042979a"},{"q":"Doanh nghiệp FDI thuộc thành phần kinh tế nào?","o":["Kinh tế thị trường định hướng xã hội chủ nghĩa","Kinh tế nhà nước","Có vốn đầu tư nước ngoài","Cương lĩnh, đường lối phát triển kinh tế - xã hội và các chủ trương, quyết sách lớn trong từng thời phát triển của đất nước"],"a":2,"e":"","g":1,"id":"24d731c5b6"},{"q":"Vai trò của lợi ích kinh tế đối với các chủ thể kinh tế - xã hội thể hiện ở khía cạnh chủ yếu nào?","o":["Mô hình kinh tế tổng quát trong thời kì quá độ lên chủ nghĩa xã hội ở nước ta","Đổi mới phải luôn luôn quán triệt quan điểm dân là gốc, vì lợi ích của nhân dân, dựa vào nhân dân, phát huy vai trò làm chủ, tinh thần trách nhiệm, sức sáng tạo và mọi nguồn lực của nhân dân, phát huy sức mạnh đại đoàn kết dân tộc","Kinh tế hàng hóa","Lợi ích kinh tế là động lực trực tiếp của các thể chế kinh tế và hoạt động kinh tế xã hội, lợi ích kinh tế là cơ sở thúc đẩy sự phát triển các lợi ích khác"],"a":3,"e":"","g":1,"id":"74a731d240"},{"q":"Trong văn kiện Đại hội Đại biểu toàn quốc lần thứ XII (01/2016) của Đảng, có nêu quan điểm nào sau đây thuộc nguyên tắc lợi ích vì dân?","o":["Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế","Có sự điều tiết của nhà nước xã hội chủ nghĩa","Mặt tích cực có lợi cho đất nước","Đổi mới phải luôn luôn quán triệt quan điểm dân là gốc, vì lợi ích của nhân dân, dựa vào nhân dân, phát huy vai trò làm chủ, tinh thần trách nhiệm, sức sáng tạo và mọi nguồn lực của nhân dân, phát huy sức mạnh đại đoàn kết dân tộc"],"a":3,"e":"","g":1,"id":"593c54871d"},{"q":"Các quan hệ lợi ích trong nền kinh tế thị trường chịu tác động của các nhân tố nào?","o":["Trình độ phát triển của lực lượng sản xuất, địa vị của chủ thể trong hệ thống quan hệ sản xuất xã hội, chính sách phân phối thu nhập của nhà nước, hội nhập kinh tế quốc tế","Kinh tế nhà nước","Kinh tế hàng hóa","Tiếp tục rà soát, bổ sung, điều chỉnh hệ thống pháp luật và các thể chế liên quan đáp ứng yêu cầu thực hiện các cam kết quốc tế của Việt Nam, thực hiện nhất quán chủ trương đa phương hóa, đa dạng hóa trong hợp tác kinh tế quốc tế, không để bị lệ thuộc vào một số ít thị trường"],"a":0,"e":"","g":1,"id":"adf5ecd2d3"},{"q":"Nền kinh tế tri thức được xem là gì?","o":["Thành tựu của nền văn minh nhân loại và không đối lập với chủ nghĩa xã hội","Nền kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lí của nhà nước, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam","Một nấc thang phát triển của lực lượng sản xuất","Cương lĩnh, đường lối phát triển kinh tế - xã hội và các chủ trương, quyết sách lớn trong từng thời phát triển của đất nước"],"a":2,"e":"","g":1,"id":"fd820ce275"},{"q":"Sự khác biệt cơ bản giữa kinh tế thị trường định hướng xã hội chủ nghĩa với kinh tế thị trường tư bản chủ nghĩa ở vấn đề nào?","o":["Thành tựu của nền văn minh nhân loại và không đối lập với chủ nghĩa xã hội","Kinh tế hàng hóa","Có sự điều tiết của nhà nước xã hội chủ nghĩa","Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế"],"a":2,"e":"","g":1,"id":"53c344d7a0"},{"q":"Đại hội Đại biểu toàn quốc lần thứ IX (4/2001) của Đảng Cộng sản Việt Nam xác định mô hình kinh tế tổng quát trong thời kì quá độ của nước ta là gì?","o":["Kinh tế thị trường định hướng xã hội chủ nghĩa","Pháp luật, các chiến lược, kế hoạch, quy hoạch và cơ chế chính sách cùng các công cụ kinh tế trên cơ sở tôn trọng những nguyên tắc của thị trường","Mặt tích cực có lợi cho đất nước","Kinh tế hàng hóa"],"a":0,"e":"","g":1,"id":"e4098200ff"},{"q":"Để đảm bảo hài hòa các lợi ích kinh tế, nhà nước có vai trò như thế nào?","o":["Kinh tế tư nhân","Cương lĩnh, đường lối phát triển kinh tế - xã hội và các chủ trương, quyết sách lớn trong từng thời phát triển của đất nước","Có sự điều tiết của nhà nước xã hội chủ nghĩa","Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế"],"a":3,"e":"","g":1,"id":"b6b0514ffe"},{"q":"Đại hội XII của Đảng có sự phát triển mới bằng việc đưa ra quan niệm: Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là nền kinh tế vận hành đầy đủ, đồng bộ theo các quy luật của kinh tế thị trường, đồng thời đảm bảo định hướng xã hội chủ nghĩa phù hợp với từng giai đoạn phát triển đất nước, đó là nền kinh tế như thế nào?","o":["Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi, điều hòa lợi ích cá nhân doanh nghiệp - xã hội, kiểm soát, ngăn ngừa tiêu cực đối với sự phát triển xã hội, giải quyết những mâu thuẫn trong quan hệ lợi ích kinh tế","Nền kinh tế thị trường hiện đại và hội nhập quốc tế, có sự quản lí của nhà nước pháp quyền xã hội chủ nghĩa, d const KEY = 'mln122-quiz-v1';
const LETTERS = 'ABCD';

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

let ui = { ch: 0, filter: 'all' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + '-ui')) || {}); } catch (e) {}
const saveUi = () => { try { localStorage.setItem(KEY + '-ui', JSON.stringify(ui)); } catch (e) {} };

const FILTERS = [
  ['all', 'Tất cả'], ['todo', 'Chưa làm'], ['wrong', 'Làm sai'], ['right', 'Làm đúng'],
];

// Questions fixed for the current view, so answering in "Làm sai" mode does not make the card vanish.
let view = [];
// In "Làm sai" mode each card starts blank so it can be retried.
let fresh = new Set();

function chapterQs() {
  if (ui.ch === 'all') return DATA.flatMap((c, i) => c.qs.map(q => ({ ...q, chName: c.name })));
  return DATA[ui.ch].qs.map(q => ({ ...q, chName: DATA[ui.ch].name }));
}

function status(q) {
  const r = store[q.id];
  if (!r) return 'todo';
  return r.ok ? 'right' : 'wrong';
}

function buildView() {
  view = chapterQs().filter(q => ui.filter === 'all' || status(q) === ui.filter);
  fresh = new Set(ui.filter === 'wrong' ? view.map(q => q.id) : []);
}

function renderNav() {
  const chEl = document.getElementById('chapters');
  chEl.innerHTML = '';
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (ui.ch === val) b.className = 'on';
    b.onclick = () => { ui.ch = val; saveUi(); refresh(); };
    chEl.appendChild(b);
  };
  DATA.forEach((c, i) => mk(c.name, i));
  mk('Tất cả chương', 'all');

  const fEl = document.getElementById('filters');
  fEl.innerHTML = '';
  const all = chapterQs();
  FILTERS.forEach(([val, label]) => {
    const n = val === 'all' ? all.length : all.filter(q => status(q) === val).length;
    const b = document.createElement('button');
    b.textContent = `${label} (${n})`;
    if (ui.filter === val) b.className = 'on';
    b.onclick = () => { ui.filter = val; saveUi(); refresh(); };
    fEl.appendChild(b);
  });
}

function renderStats() {
  const all = chapterQs();
  const done = all.filter(q => store[q.id]).length;
  const right = all.filter(q => status(q) === 'right').length;
  document.getElementById('stats').textContent =
    `Đã làm ${done}/${all.length} · Đúng ${right}` + (done ? ` (${Math.round(right / done * 100)}%)` : '');
  document.getElementById('bar').style.width = (all.length ? right / all.length * 100 : 0) + '%';
}

function renderCard(q, idx) {
  const el = document.createElement('div');
  el.className = 'q';
  const r = fresh.has(q.id) ? null : store[q.id];

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>Câu ${idx + 1}</span>` + (ui.ch === 'all' ? `<span>${q.chName}</span>` : '');
  const prev = store[q.id];
  if (prev && prev.wrong) {
    const t = document.createElement('span');
    t.className = 'tag bad';
    t.textContent = `sai ${prev.wrong} lần`;
    meta.appendChild(t);
  }
  if (q.g) {
    const t = document.createElement('span');
    t.className = 'tag';
    t.title = 'Câu hỏi–đáp ngắn trong tài liệu; các phương án nhiễu được lấy từ đáp án của câu khác';
    t.textContent = 'hỏi nhanh';
    meta.appendChild(t);
  }
  if (prev) {
    const c = document.createElement('button');
    c.className = 'clear';
    c.textContent = 'Xóa câu trả lời';
    c.onclick = () => clearOne(q, idx, el);
    meta.appendChild(c);
  }
  el.appendChild(meta);

  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = q.q;
  el.appendChild(text);

  const btns = q.o.map((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b>${LETTERS[i]}.</b><span></span>`;
    b.lastChild.textContent = o;
    b.onclick = () => answer(q, i, el);
    el.appendChild(b);
    return b;
  });

  if (r) showResult(el, q, r.c, btns);
  return el;
}

function showResult(el, q, chosen, btns) {
  el.classList.add('done');
  btns = btns || [...el.querySelectorAll('.opt')];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === chosen) b.classList.add('wrong');
  });
  if (q.e && !el.querySelector('.expl')) {
    const e = document.createElement('div');
    e.className = 'expl';
    e.textContent = q.e;
    el.appendChild(e);
  }
}

function answer(q, i, el) {
  if (el.classList.contains('done')) return;
  const prev = store[q.id] || {};
  const ok = i === q.a;
  store[q.id] = { c: i, ok, wrong: (prev.wrong || 0) + (ok ? 0 : 1), t: Date.now() };
  save();
  fresh.delete(q.id);
  el.replaceWith(renderCard(q, [...el.parentNode.children].indexOf(el)));
  renderNav();
  renderStats();
}

function clearOne(q, idx, el) {
  delete store[q.id];
  save();
  fresh.delete(q.id);
  el.replaceWith(renderCard(q, idx));
  renderNav();
  renderStats();
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!view.length) {
    const msg = { wrong: 'Không còn câu nào làm sai 🎉', todo: 'Đã làm hết các câu.', right: 'Chưa có câu nào làm đúng.' };
    list.innerHTML = `<div class="empty">${msg[ui.filter] || 'Không có câu hỏi.'}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  view.forEach((q, i) => frag.appendChild(renderCard(q, i)));
  list.appendChild(frag);
}

function refresh() {
  if (ui.ch !== 'all' && !DATA[ui.ch]) ui.ch = 0;
  buildView();
  renderNav();
  renderStats();
  renderList();
  window.scrollTo(0, 0);
}

document.getElementById('shuffle').onclick = () => {
  for (let i = view.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [view[i], view[j]] = [view[j], view[i]];
  }
  renderList();
  window.scrollTo(0, 0);
};

document.getElementById('reset').onclick = () => {
  const name = ui.ch === 'all' ? 'TẤT CẢ các chương' : DATA[ui.ch].name;
  if (!confirm(`Xóa mọi câu trả lời của ${name}?`)) return;
  chapterQs().forEach(q => delete store[q.id]);
  save();
  refresh();
};

refresh();
</script>
</body>
</html>
